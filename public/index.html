
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Fael AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a2b;
      --panel2: #192338;
      --border: #29364d;
      --text: #edf2ff;
      --muted: #9baac4;
      --accent: #8b7cff;
      --user: #35305f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 16px;
    }

    header, main, footer {
      width: 100%;
      max-width: 900px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 4px 2px 24px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: linear-gradient(135deg, #8b7cff, #5c8cff);
      font-size: 25px;
      font-weight: 800;
    }

    h1 { font-size: 23px; margin: 0; letter-spacing: -.5px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

    .chat {
      height: min(72vh, 760px);
      min-height: 430px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 70px #0003;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .toolbar label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    select {
      display: block;
      margin-top: 5px;
      width: min(100%, 340px);
      padding: 10px 36px 10px 12px;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
    }

    .status {
      font-size: 12px;
      color: #a8e8c1;
    }

    #model-info {
      padding: 0 18px 12px;
      color: var(--muted);
      font-size: 12px;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow-wrap: anywhere;
    }

    .message p { margin: 0; white-space: pre-wrap; }
    .assistant-message { align-self: flex-start; background: var(--panel2); }
    .user-message {
      align-self: flex-end;
      background: var(--user);
      border-color: #51478a;
    }

    .message-label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid var(--border);
      background: #0f1727;
    }

    #user-input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      max-height: 180px;
      resize: vertical;
      padding: 13px 14px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      font: inherit;
    }

    #user-input:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      min-height: 48px;
      padding: 0 19px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    #typing-indicator {
      display: none;
      color: var(--muted);
      padding: 0 22px 12px;
      font-size: 13px;
    }

    #typing-indicator.visible { display: block; }

    footer {
      padding: 14px 0 4px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 560px) {
      body { padding: 15px 10px; }
      header { padding-bottom: 16px; }
      .chat { height: 76vh; min-height: 400px; }
      #chat-messages { padding: 14px; }
      .message { max-width: 94%; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      select { width: 100%; }
      .composer { padding: 10px; }
      button { padding: 0 13px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">✦</div>
    <div>
      <h1>Fael AI</h1>
      <p>Seu espaço de inteligência artificial</p>
    </div>
  </header>

  <main class="chat">
    <div class="toolbar">
      <div>
        <label for="model-select">Modelo de IA</label>
        <select id="model-select">
          <option value="llama">Llama 3.1 8B · Geral</option>
          <option value="glm">GLM-4.7-Flash · Raciocínio e código</option>
          <option value="gemma">Gemma 4 26B A4B · Tarefas complexas</option>
        </select>
      </div>
      <span class="status">● Workers AI</span>
    </div>

    <div id="model-info">
      Modelo de uso geral. Escolha outro modelo no menu acima.
    </div>

    <div id="chat-messages" aria-live="polite" aria-label="Conversa">
      <div class="message assistant-message">
        <div class="message-label">Fael AI</div>
        <p>Olá! 👋 Sou o Fael AI. Escolha um modelo e me diga no que posso ajudar.</p>
      </div>
    </div>

    <div id="typing-indicator" role="status">A IA está pensando...</div>

    <div class="composer">
      <textarea
        id="user-input"
        placeholder="Escreva sua mensagem..."
        rows="1"
        aria-label="Sua mensagem"
      ></textarea>
      <button id="send-button" type="button">Enviar ↑</button>
    </div>
  </main>

  <footer>Fael AI · Hospedado na Cloudflare</footer>
  <script src="chat.js"></script>
</body>
</html>
